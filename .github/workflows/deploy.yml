name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /astronomy-scioly-dsos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Pages site
        run: |
          echo "========== BUILD OUTPUT =========="
          find dist/client -maxdepth 3 -type f -name "*.html" -print

          rm -rf _site
          mkdir _site

          # Keep public/static files produced at dist/client root
          cp -a dist/client/. _site/

          # Vinext + basePath puts the homepage in this directory.
          # Move its CONTENTS to the Pages artifact root.
          if [ -f "dist/client/astronomy-scioly-dsos/index.html" ]; then
            echo "FOUND HOMEPAGE"
            cp -a dist/client/astronomy-scioly-dsos/. _site/
            rm -rf _site/astronomy-scioly-dsos
          fi

          echo "========== FINAL SITE =========="
          find _site -maxdepth 2 -type f -name "*.html" -print

          test -f _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
