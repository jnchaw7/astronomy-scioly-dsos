name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /astronomy-scioly-dsos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fix GitHub Pages output
        run: |
          echo "Before:"
          find dist/client -maxdepth 2 -name "index.html" -print

          if [ -d "dist/client/astronomy-scioly-dsos" ]; then
            cp -a dist/client/astronomy-scioly-dsos/. dist/client/
            rm -rf dist/client/astronomy-scioly-dsos
          fi

          touch dist/client/.nojekyll

          echo "After:"
          find dist/client -maxdepth 2 -name "index.html" -print

          test -f dist/client/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
