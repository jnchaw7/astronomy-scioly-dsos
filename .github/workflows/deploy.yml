name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /astronomy-scioly-dsos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and prerender
        run: npm run build -- --prerender-all

      - name: Prepare Pages
        run: |
          echo "========== GENERATED HTML =========="
          find dist/client -type f -name "*.html" -print

          test -f dist/client/index.html

          rm -rf _site
          mkdir _site
          cp -a dist/client/. _site/

          # Vinext may place prefixed assets inside this folder.
          # GitHub Pages already provides the repository URL prefix,
          # so merge those files into the artifact root.
          if [ -d "_site/astronomy-scioly-dsos" ]; then
            cp -a _site/astronomy-scioly-dsos/. _site/
            rm -rf _site/astronomy-scioly-dsos
          fi

          touch _site/.nojekyll

          echo "========== FINAL =========="
          find _site -maxdepth 2 -type f -name "*.html" -print
          test -f _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
